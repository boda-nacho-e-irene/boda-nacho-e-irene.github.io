}

/* ---------- guardar la fecha ---------- */

/* El «save the date» vive dentro de la sección de la cuenta atrás: las dos
   hablan del mismo día y por separado no daban para una sección cada una. Así
   el invitado ve lo que falta y guarda la fecha en el mismo sitio. */

/* Hasta cuándo llega el evento en el calendario: desde la hora de la ceremonia,
   las horas de BODA.duracion. Nadie sabe cuándo acaba una boda, pero el
   calendario pide un final. */
var finEventoMs = objetivoMs === null
  ? null
  : objetivoMs + Math.max(1, +BODA.duracion || 1) * 3600000;

/* 20270717T103000Z: el sello de tiempo en UTC que piden por igual el .ics y
   Google Calendar. En UTC no hay que arrastrar la zona de la boda a ninguno de
   los dos. */
function selloUtc(ms) {
  var d = new Date(ms);
  return String(d.getUTCFullYear()) + dos(d.getUTCMonth() + 1) + dos(d.getUTCDate()) +
         'T' + dos(d.getUTCHours()) + dos(d.getUTCMinutes()) + dos(d.getUTCSeconds()) + 'Z';
}

/* Lo que el invitado leerá en el evento. Sin el enlace de la invitación a
   propósito: lleva su token, y los eventos se comparten y se sincronizan con
   más servicios de los que uno cree. */
function descripcionEvento() {
  return 'Nos casamos en ' + BODA.lugar + '. La ceremonia es a las ' + BODA.hora + '.';
}

/* Los valores de texto del .ics escapan la barra, la coma y el punto y coma, y
   los saltos de línea viajan como \n literal. */
function textoIcs(s) {
  return String(s == null ? '' : s)
    .replace(/\\/g, '\\\\')
    .replace(/([,;])/g, '\\$1')
    .replace(/\r\n|\r|\n/g, '\\n');
}

/* Cuántos octetos ocupa este carácter en UTF-8: el formato cuenta bytes, no
   letras, y «Méndez» pesa más de lo que mide. */
function octetos(caracter) {
  var n = caracter.charCodeAt(0);
  if (n < 0x80) return 1;
  if (n < 0x800) return 2;
  if (n >= 0xD800 && n < 0xDC00) return 4;   // par subrogado: cuenta por los dos
  return 3;
}

/* Ninguna línea del .ics pasa de 75 octetos: lo que sobra sigue en la
   siguiente, empezando por un espacio. Sin esto, un nombre o un lugar largos
   rompen el archivo en algunos calendarios. */
function plegar(linea) {
  var partes = [];
  var trozo = '';
  var bytes = 0;
  for (var i = 0; i < linea.length; i++) {
    var caracter = linea.charAt(i);
    var codigo = linea.charCodeAt(i);
    if (codigo >= 0xD800 && codigo < 0xDC00 && i + 1 < linea.length) {
      caracter += linea.charAt(++i);         // los dos medios del par van juntos
    }
    var peso = octetos(caracter);
    if (bytes + peso > 75) {
      partes.push(trozo);
      trozo = '';
      bytes = 1;                             // el espacio de la continuación cuenta
    }
    trozo += caracter;
    bytes += peso;
  }
  partes.push(trozo);
  return partes.join('\r\n ');
}

/* El archivo del evento, entero, hecho aquí mismo sin pedirle nada al servidor.
   Las líneas van separadas por CRLF porque es lo que pide el formato. */
function contenidoIcs() {
  var lineas = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//boda//invitacion//ES',
    'CALSCALE:GREGORIAN',
    'METHOD:PUBLISH',
    'BEGIN:VEVENT',
    /* Siempre el mismo: si el invitado lo añade dos veces, el calendario
       reconoce el evento y lo actualiza en vez de duplicarlo. */
    'UID:boda-' + selloUtc(objetivoMs) + '@invitacion',
    'DTSTAMP:' + selloUtc(Date.now()),
    'DTSTART:' + selloUtc(objetivoMs),
    'DTEND:' + selloUtc(finEventoMs),
    'SUMMARY:' + textoIcs(BODA.evento),
    'LOCATION:' + textoIcs(BODA.direccion || BODA.lugar),
    'DESCRIPTION:' + textoIcs(descripcionEvento()),
    /* Un aviso el día antes: es lo que el invitado viene a buscar aquí. */
    'BEGIN:VALARM',
    'ACTION:DISPLAY',
    'TRIGGER:-P1D',
    'DESCRIPTION:' + textoIcs(BODA.evento),
    'END:VALARM',
    'END:VEVENT',
    'END:VCALENDAR'
  ];
  for (var i = 0; i < lineas.length; i++) { lineas[i] = plegar(lineas[i]); }
  return lineas.join('\r\n') + '\r\n';
}

/* Para quien vive en Google Calendar: el mismo evento, pero abierto ya en su
   pantalla de guardar. Ahí no hace falta descargar nada. */
function enlaceGoogle() {
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE' +
         '&text='     + encodeURIComponent(BODA.evento) +
         '&dates='    + selloUtc(objetivoMs) + '/' + selloUtc(finEventoMs) +
         '&location=' + encodeURIComponent(BODA.direccion || BODA.lugar) +
         '&details='  + encodeURIComponent(descripcionEvento());
}

/* El .ics se le pasa al calendario que tenga el invitado —Calendario en el
   iPhone, Outlook en el trabajo— y el evento entra con su aviso puesto. Si el
   navegador no sabe fabricar el archivo, le queda el enlace de Google. */
function guardarEnCalendario() {
  var aviso = document.getElementById('calendario-aviso');
  var url;

  try {
    url = URL.createObjectURL(new Blob([contenidoIcs()], { type: 'text/calendar;charset=utf-8' }));
  } catch (e) {
    if (aviso) {
      aviso.className = 'estado mal';
      aviso.textContent = 'Este navegador no nos deja preparar el archivo. Abre el enlace de Google Calendar.';
    }
    return;
  }

  var enlace = document.createElement('a');
  enlace.href = url;
  enlace.download = 'boda.ics';
  enlace.rel = 'noopener';
  document.body.appendChild(enlace);
  enlace.click();
  document.body.removeChild(enlace);

  /* El objeto se suelta con un poco de aire: revocarlo en el mismo tic corta la
     descarga en algunos navegadores. */
  setTimeout(function () { URL.revokeObjectURL(url); }, 4000);

  if (aviso) {
    aviso.className = 'estado';
    aviso.textContent = 'Listo: abre el archivo y tu calendario hace el resto.';
  }
}

/* Sin fecha válida no hay nada que guardar y el bloque no se pinta. */
function bloqueCalendario() {
  if (objetivoMs === null) return '';
  return '<div class="calendario">' +
           '<span class="calendario-rotulo">Save the date</span>' +
           '<p class="calendario-texto">Guarda el ' + escapar(BODA.fecha) +
             ' en tu calendario y deja que te avise él.</p>' +
           '<button type="button" class="guardar" id="guardar">Añadir a mi calendario</button>' +
           '<p class="calendario-otro">' +
             '<a href="' + escapar(enlaceGoogle()) + '" target="_blank" rel="noopener">' +
               'Abrir en Google Calendar</a>' +
           '</p>' +
           '<p class="estado" id="calendario-aviso" aria-live="polite"></p>' +
         '</div>';
}

/* --- transporte --- */

/* La hora, o las horas, a las que sale ese autobús. */
function horasSalida(salidas) {
  if (!salidas || !salidas.length) return '';
  var html = '';
  for (var i = 0; i < salidas.length; i++) {
    html += '<span class="hora">' + escapar(salidas[i]) + '</span>';
  }
  return '<p class="salidas">' +
           '<span class="salidas-rotulo">' +
             (salidas.length === 1 ? 'Salida' : 'Salidas') +
           '</span>' +
           '<span class="horas">' + html + '</span>' +
         '</p>';
}

/* Las paradas van en una lista ordenada: el orden es el del recorrido, y así
   también se lee en voz alta como «uno de tres». */
function ruta(paradas) {
  var html = '';
  for (var i = 0; i < paradas.length; i++) {
    html += '<li><span class="ruta-lugar">' + escapar(paradas[i].lugar) + '</span>' +
            (paradas[i].detalle
              ? '<span class="ruta-detalle">' + escapar(paradas[i].detalle) + '</span>'
              : '') +
            '</li>';
  }
  return '<ol class="ruta">' + html + '</ol>';
}

/* Lo que se guarda cuando el invitado no coge el autobús de vuelta: así la
   celda de la hoja distingue «no lo necesita» de «todavía no ha contestado». */
var SIN_VUELTA = 'No';

/* Las horas entre las que elige el invitado: las del trayecto marcado como
   `elegible`. Vacío si no hay ninguno, o si solo tiene una hora (entonces no
   hay nada que elegir y no pintamos los botones). */
function salidasElegibles() {
  var ts = TRANSPORTE.trayectos || [];
  for (var i = 0; i < ts.length; i++) {
    if (ts[i].elegible && ts[i].salidas && ts[i].salidas.length > 1) return ts[i].salidas;
  }
  return [];
}

/* Van con los recorridos, en *Transporte*, y llevan su propio botón: la
   elección se guarda sola, sin pasar por la confirmación. */
function camposVuelta() {
  var horas = salidasElegibles();
  if (!horas.length) return '';

  var botones = '';
  for (var i = 0; i < horas.length; i++) {
    botones += '<button type="button" class="chip" data-v="' + escapar(horas[i]) + '" aria-pressed="false">'
             + escapar(horas[i]) + '</button>';
  }
  botones += '<button type="button" class="chip" data-v="' + SIN_VUELTA + '" aria-pressed="false">'
           + 'No lo necesito</button>';

  return '<fieldset class="campos-vuelta">' +
           '<legend>Autobús de vuelta</legend>' +
           '<p class="ayuda">Sale del convento hacia Palencia y Venta de Baños. Dinos con cuál contamos.</p>' +
           '<div class="chips" id="vuelta">' + botones + '</div>' +
         '</fieldset>' +
         '<button type="button" class="enviar" id="enviar-transporte" disabled>Guardar mi autobús</button>';
}

/* Exclusiva: solo se vuelve en un autobús. */
function elegirVuelta(hora) {
  var caja = document.getElementById('vuelta');
  if (!caja) return;
  vuelta = hora;
  var b = caja.getElementsByTagName('button');
  for (var i = 0; i < b.length; i++) {
    b[i].setAttribute('aria-pressed', b[i].getAttribute('data-v') === hora ? 'true' : 'false');
  }
  document.getElementById('enviar-transporte').disabled = false;
}

function seccionTransporte() {
  var trayectos = TRANSPORTE.trayectos;
  if (!trayectos || !trayectos.length) return '';

  var html = '';
  for (var i = 0; i < trayectos.length; i++) {
    var t = trayectos[i];
    html += '<div class="trayecto" id="' + escapar(t.id) + '">' +
              '<h3 class="sub-titulo">' + escapar(t.titulo) + '</h3>' +
              horasSalida(t.salidas) +
              ruta(t.paradas) +
            '</div>';
  }

  return '<section class="seccion" id="transporte">' +
           titulo('transporte', 'Transporte') +
           bloque('transporte',
             '<div class="trayectos">' + html + '</div>' +
             (TRANSPORTE.nota
               ? '<p class="promesa" style="margin-top:2rem">' + escapar(TRANSPORTE.nota) + '</p>'
               : '') +
             camposVuelta()
           ) +
         '</section>';
}

/* --- secciones en obras --- */

/* Devuelve la sección de EN_OBRAS con ese id, o cadena vacía si ya no está
   (que es como se apaga: se borra su entrada y se escribe la de verdad). */
function seccionEnObras(id) {
  for (var i = 0; i < EN_OBRAS.length; i++) {
    if (EN_OBRAS[i].id !== id) continue;
    return '<section class="seccion" id="' + escapar(id) + '">' +
             titulo(id, EN_OBRAS[i].titulo) +
             '<p class="wip-linea"><span class="wip">En preparación</span></p>' +
             '<p class="promesa">' + escapar(EN_OBRAS[i].texto) + '</p>' +
           '</section>';
  }
  return '';
}

function pararCuenta() {
  if (reloj) { clearInterval(reloj); reloj = null; }
}

function pintarCuenta() {
  var caja = document.getElementById('cuenta');
  if (!caja) { pararCuenta(); return; }          // la pantalla ya no es esta

  /* Se recalcula contra el reloj real en cada tic: si el navegador frena el
     intervalo en una pestaña de fondo, no acumulamos retraso. */
  var restante = objetivoMs - Date.now();

  if (restante <= 0) {
    pararCuenta();
    caja.innerHTML = '<p class="hoy">Hoy nos casamos</p>';
    return;
  }

  var seg   = Math.floor(restante / 1000);
  var dias  = Math.floor(seg / 86400);
  var horas = Math.floor((seg % 86400) / 3600);
  var mins  = Math.floor((seg % 3600) / 60);
  var segs  = seg % 60;

  caja.innerHTML =
    '<div class="digitos" aria-hidden="true">' +
      celda(dias,       dias  === 1 ? 'día'  : 'días') +
      celda(dos(horas), horas === 1 ? 'hora' : 'horas') +
      celda(dos(mins),  'min') +
      celda(dos(segs),  'seg') +
    '</div>' +
    /* Las cifras van ocultas al lector de pantalla: cambian cada segundo y no
       aportarían nada leídas. Esta frase, que solo cambia de día en día, sí. */
    '<p class="solo-voz">' + (dias === 0
      ? 'Falta menos de un día para la boda.'
      : 'Faltan ' + dias + (dias === 1 ? ' día' : ' días') + ' para la boda.') + '</p>';
}

function arrancarCuenta() {
  pararCuenta();
  if (!document.getElementById('cuenta')) return;
  pintarCuenta();
  if (Date.now() < objetivoMs) { reloj = setInterval(pintarCuenta, 1000); }
}

/* --- sugerencias de música --- */

/* Va detrás de «Confirmar», así que `ajustarAlcance()` se la lleva por delante
   en cuanto alguien dice que no puede venir, como al resto de las de después.
   Las canciones que hubiese mandado antes siguen en la hoja: solo desaparece
   la sección. */
/* El único formulario sin botón de enviar: cada canción se guarda al añadirla,
   así que no hay nada que reenviar. Se pliega igual al volver a entrar, y su
   botón de resumen solo abre y cierra. */
function seccionPlaylist() {
  return '<section class="seccion" id="playlist">' +
           titulo('playlist', 'Pon tú la música') +
           bloque('playlist',
             '<p class="ayuda">Busca hasta ' + MAX_CANCIONES + ' canciones y te las apuntamos. ' +
               'Si añades una más, sustituye a la más antigua.</p>' +
             '<h3 class="subtitulo">Tus canciones</h3>' +
             '<ul class="mis-canciones" id="mis-canciones"></ul>' +
             '<fieldset>' +
               '<label class="campo" for="buscar">Busca una canción</label>' +
               '<input type="search" id="buscar" placeholder="Título o artista" autocomplete="off">' +
             '</fieldset>' +
             '<div class="resultados" id="resultados" aria-live="polite"></div>'
           ) +
         '</section>';
}

/* Escribe en el `.estado` del bloque, que está fuera del pliegue: lo que se
   cuenta de una canción se sigue leyendo aunque la sección se plegase. */
function estadoMusica(texto, mal) {
  estadoBloque('playlist', texto, mal);
}

/* La lista ha cambiado: repintarla, poner al día el resumen de la sección —sin
   plegarla, que el invitado está en ello— y el índice, que lleva la cuenta. */
function repasarCanciones() {
  pintarMisCanciones();
  repasarBloques('playlist');
  montarIndice();
}

/* Las que ya ha mandado, cada una con su botón de quitar. */
function pintarMisCanciones() {
  var caja = document.getElementById('mis-canciones');
  if (!caja) return;

  if (!canciones.length) {
    caja.innerHTML = '<li class="vacio">Todavía no has propuesto ninguna.</li>';
    return;
  }

  var html = '';
  for (var i = 0; i < canciones.length; i++) {
    var c = canciones[i];
    html += '<li>' +
              '<span class="pista"><b>' + escapar(c.cancion) + '</b>' +
                '<span>' + escapar(c.artista || 'Sin artista') + '</span></span>' +
              '<button type="button" class="quitar" data-id="' + escapar(c.id) + '">Quitar</button>' +
            '</li>';
  }
  caja.innerHTML = html;
}

/* Los objetos de iTunes se guardan en `hallazgos` y las filas los señalan por
   posición: así no hay que meter JSON dentro de un atributo. */
function pintarHallazgos(lista) {
  var caja = document.getElementById('resultados');
  if (!caja) return;

  hallazgos = lista || [];
  var html = '';

  for (var i = 0; i < hallazgos.length; i++) {
    var r = hallazgos[i];
    var album = r.collectionName ? ' · ' + r.collectionName : '';
    html += '<div class="resultado">' +
              (r.artworkUrl100
                ? '<img class="caratula" src="' + escapar(r.artworkUrl100) + '" ' +
                    'width="48" height="48" alt="" loading="lazy" decoding="async">'
                : '<span class="caratula"></span>') +
              '<span class="pista"><b>' + escapar(r.trackName) + '</b>' +
                '<span>' + escapar(r.artistName + album) + '</span></span>' +
              '<button type="button" class="anadir" data-i="' + i + '">Añadir</button>' +
            '</div>';
  }
  caja.innerHTML = html;
}

function limpiarHallazgos() {
  buscadaN++;                                   // lo que venga de camino ya no vale
  hallazgos = [];
  var caja = document.getElementById('resultados');
  if (caja) { caja.innerHTML = ''; }
}

/* Con la canción ya apuntada arriba, la búsqueda que la encontró sobra: se
   vacía para empezar la siguiente en limpio. */
function limpiarBusqueda() {
  if (buscador) { clearTimeout(buscador); buscador = null; }
  var campo = document.getElementById('buscar');
  if (campo) { campo.value = ''; }
  limpiarHallazgos();
}

function buscarEnItunes(texto) {
  var mia = ++buscadaN;
  var url = 'https://itunes.apple.com/search?media=music&entity=song&limit=6' +
            '&country=' + encodeURIComponent(ITUNES_PAIS) +
            '&term=' + encodeURIComponent(texto);

  jsonp(url, function (d) {
    if (mia !== buscadaN) return;               // llegó tarde: ya hay otra búsqueda
    var caja = document.getElementById('resultados');
    if (!caja) return;

    if (!d) {
      hallazgos = [];
      caja.innerHTML = '';
      estadoMusica('No hemos podido buscar. Prueba otra vez en un momento.', true);
      return;
    }

    var lista = d.results || [];
    if (!lista.length) {
      // No está en iTunes (o se escribe de otra manera): que la mande a mano.
      hallazgos = [];
      caja.innerHTML = '<p class="vacio">No encontramos nada con eso. ' +
        '<button type="button" class="anadir" data-manual="1">Añadirla tal cual</button></p>';
      return;
    }

    pintarHallazgos(lista);
  });
}

/* iTunes corta sobre las 20 búsquedas por minuto y por IP, así que se espera a
   que el invitado deje de teclear. */
function programarBusqueda(texto) {
  if (buscador) { clearTimeout(buscador); buscador = null; }
  var limpio = texto.replace(/^\s+|\s+$/g, '');

  if (limpio.length < 2) { limpiarHallazgos(); return; }
  buscador = setTimeout(function () { buscarEnItunes(limpio); }, 400);
}

function buscarYa() {
  if (buscador) { clearTimeout(buscador); buscador = null; }
  var texto = document.getElementById('buscar').value.replace(/^\s+|\s+$/g, '');
  if (texto.length >= 2) { buscarEnItunes(texto); }
}

/* El backend devuelve siempre la lista entera ya resuelta, así que aquí no hay
   que saber nada de límites ni de sustituciones: se repinta lo que llega. */
function anadirCancion(c) {
  estadoMusica('Guardando…');

  pedir('POST', API, JSON.stringify({
    token: token,
    accion: 'cancion',
    cancion: c.cancion,
    artista: c.artista,
    album: c.album,
    itunes_id: c.itunes_id,
    enlace: c.enlace
  }), function (d) {
    if (!d || !d.ok) {
      estadoMusica('No se ha podido guardar. Inténtalo otra vez.', true);
      return;
    }
    canciones = d.canciones || [];
    repasarCanciones();

    if (d.repetida) {
      // No se ha apuntado nada: le dejamos los resultados por si quiere otra.
      estadoMusica('Esa ya la tenías apuntada.');
      return;
    }

    limpiarBusqueda();
    estadoMusica(d.quitada
      ? 'Apuntada. Hemos quitado «' + d.quitada.cancion + '» para hacerle sitio.'
      : 'Apuntada.');
  });
}

function quitarCancion(id) {
  estadoMusica('Quitando…');

  pedir('POST', API, JSON.stringify({
    token: token, accion: 'quitar_cancion', id: id
  }), function (d) {
    if (!d || !d.ok) {
      estadoMusica('No se ha podido quitar. Inténtalo otra vez.', true);
      return;
    }
    canciones = d.canciones || [];
    repasarCanciones();
    estadoMusica('Quitada.');
  });
}

/* Sube desde donde se hizo clic hasta el botón: el clic puede caer en la
   carátula o en el texto de dentro. */
function botonDe(destino, tope) {
  var b = destino;
  while (b && b !== tope && b.tagName !== 'BUTTON') { b = b.parentNode; }
  return b && b !== tope ? b : null;
}

/* Los `id` de SECCIONES que van detrás de «Confirmar»: son los que se caen de
   la página cuando alguien nos dice que no puede venir. Salen de la lista y no
   a mano, así que reordenar SECCIONES los recoloca solos. */
function seccionesTrasConfirmar() {
  var fuera = [];
  var visto = false;
  for (var i = 0; i < SECCIONES.length; i++) {
    if (visto) { fuera.push(SECCIONES[i].id); }
    if (SECCIONES[i].id === 'confirmar') { visto = true; }
  }
  return fuera;
}

/* A quien no puede venir le sobra todo lo que viene después de confirmar
   (empezando por una cuenta atrás que no va con él): se lo quitamos de la
   página y del índice. Le queda el mensaje para nosotros, que es lo que sí
   tiene sentido que nos deje. Si cambia de idea, vuelve todo. */
function ajustarAlcance(asiste) {
  var fuera = seccionesTrasConfirmar();
  for (var i = 0; i < fuera.length; i++) {
    var sec = document.getElementById(fuera[i]);
    if (sec) { sec.hidden = !asiste; }
  }
  // El reloj de la cuenta atrás no tiene por qué seguir latiendo si no se ve.
  if (asiste) { arrancarCuenta(); } else { pararCuenta(); }
  montarIndice();
}

/* Lo que se guarda cuando el invitado no tiene ninguna alergia: así la celda
   de la hoja distingue «no necesita nada» de «todavía no lo ha dicho», y el
   formulario se puede dejar completo sin marcar alérgenos falsos. */
var SIN_ALERGIAS = 'Ninguna';

/* Los alérgenos, y al final la salida para quien no tiene ninguno. */
function chipsAlergenos() {
  var botones = '';
  for (var i = 0; i < ALERGENOS.length; i++) {
    botones += '<button type="button" class="chip" data-a="' + escapar(ALERGENOS[i]) + '" aria-pressed="false">'
             + escapar(ALERGENOS[i]) + '</button>';
  }
  botones += '<button type="button" class="chip" data-a="' + escapar(SIN_ALERGIAS) + '" aria-pressed="false">'
           + 'Ninguna</button>';
  return botones;
}

/* «Ninguna» no convive con nada: marcarla limpia el resto, y marcar cualquier
   alérgeno la apaga. Así nunca sale a la cocina una lista que se contradice. */
function alternarAlergeno(boton) {
  var caja = document.getElementById('chips');
  var nombre = boton.getAttribute('data-a');
  var activo = boton.getAttribute('aria-pressed') === 'true';

  if (activo) {
    boton.setAttribute('aria-pressed', 'false');
    delete marcados[nombre];
    repasarEnvioAlergias();
    return;
  }

  var b = caja.getElementsByTagName('button');
  for (var i = 0; i < b.length; i++) {
    var otro = b[i].getAttribute('data-a');
    var choca = (nombre === SIN_ALERGIAS) ? otro !== SIN_ALERGIAS : otro === SIN_ALERGIAS;
    if (choca) {
      b[i].setAttribute('aria-pressed', 'false');
      delete marcados[otro];
    }
  }

  boton.setAttribute('aria-pressed', 'true');
  marcados[nombre] = true;
  repasarEnvioAlergias();
}

/* La lista tal como va a la hoja: los chips marcados y, al final, lo que haya
   escrito en «otra cosa». La usan el envío y el resumen, que tienen que decir
   lo mismo. */
function alergenosTexto() {
  var campo = document.getElementById('otros');
  var otros = campo ? campo.value.replace(/^\s+|\s+$/g, '') : '';
  var lista = [];

  for (var k in marcados) {
    if (!marcados.hasOwnProperty(k)) continue;
    /* Si nos cuenta algo por escrito, «Ninguna» ya no vale como respuesta:
       la quitamos para que la hoja no diga las dos cosas a la vez. */
    if (k === SIN_ALERGIAS && otros) continue;
    lista.push(k);
  }
  if (otros) lista.push(otros);
  return lista.join(', ');
}

/* Su propia sección, con su formulario y su botón: los alérgenos se guardan sin
   esperar a nada más. Antes vivían plegados dentro de *Confirmar* porque
   compartían con ella el botón de enviar. El grupo de chips lleva su etiqueta a
   mano: el <legend> que la daba es ahora el título de la sección. */
function seccionAlergias() {
  return '<section class="seccion" id="alergias">' +
           titulo('alergias', 'Alergias e intolerancias') +
           bloque('alergias',
             '<fieldset>' +
               '<p class="ayuda">Marca lo que necesites. Se lo pasamos tal cual a la cocina.</p>' +
               '<div class="chips" id="chips" role="group" aria-label="Alergias e intolerancias">' +
                 chipsAlergenos() +
               '</div>' +
             '</fieldset>' +
             '<fieldset>' +
               '<label class="campo" for="otros">Otra cosa que debamos saber</label>' +
               '<input type="text" id="otros" placeholder="Otra alergia, medicación, lo que sea">' +
             '</fieldset>' +
             '<button type="button" class="enviar" id="enviar-alergias" disabled>Guardar alergias</button>'
           ) +
         '</section>';
}

/* --- formularios plegables --- */

/* Cada sección que nos pide algo lleva su formulario dentro y su propio botón
   de enviar: se guardan por separado y ninguna espera a las demás. Guardado lo
   suyo, el cuerpo se pliega y queda la línea de resumen con su botón, que lo
   vuelve a abrir para cambiarlo y reenviarlo.

   `alto` es el tope de `max-height` del cuerpo (ver la hoja de estilos). Va
   holgado a propósito: quedarse corto recorta el contenido, y pasarse solo
   cuesta que el primer tramo de la animación no se vea, que es lo que tapa el
   desvanecido. En móvil estrecho estos bloques crecen bastante —los dos
   trayectos se apilan, y la playlist suma tres canciones y seis resultados—,
   así que conviene medirlos antes de bajar ninguno.
   `resumen` devuelve lo que se lee plegado, o cadena vacía si todavía no hay
   nada guardado, y es también lo que decide si el bloque se pliega. */
var BLOQUES = [
  { id: 'confirmar',  alto: '44rem', resumen: resumenConfirmar },
  { id: 'alergias',   alto: '44rem', resumen: resumenAlergias },
  { id: 'transporte', alto: '90rem', resumen: resumenTransporte },
  { id: 'playlist',   alto: '90rem', resumen: resumenPlaylist }
];

function altoDe(id) {
  for (var i = 0; i < BLOQUES.length; i++) {
    if (BLOQUES[i].id === id) return BLOQUES[i].alto;
  }
  return '90rem';
}

/* El `.estado` va fuera del cuerpo a propósito: dentro, el «Guardado» se
   plegaría con el formulario justo al aparecer y nadie llegaría a leerlo. */
function bloque(id, cuerpo) {
  return '<div class="bloque" id="bloque-' + id + '">' +
           '<p class="resumen" id="resumen-' + id + '" hidden>' +
             '<span class="resumen-texto" id="resumen-texto-' + id + '"></span>' +
             '<button type="button" class="cambiar" id="cambiar-' + id + '"' +
               ' aria-expanded="false" aria-controls="cuerpo-' + id + '">Cambiar</button>' +
           '</p>' +
           '<div class="cuerpo" id="cuerpo-' + id + '" style="--alto:' + altoDe(id) + '">' +
             cuerpo +
           '</div>' +
           '<p class="estado" id="estado-' + id + '" aria-live="polite"></p>' +
         '</div>';
}

/* El botón dice lo que va a hacer, no en qué estado está. */
function plegarBloque(id, si) {
  var caja = document.getElementById('bloque-' + id);
  var boton = document.getElementById('cambiar-' + id);
  if (!caja || !boton) return;

  caja.className = si ? 'bloque plegado' : 'bloque';
  boton.setAttribute('aria-expanded', si ? 'false' : 'true');
  boton.textContent = si ? 'Cambiar' : 'Cerrar';
}

/* El único sitio que decide qué se pliega: si un bloque tiene resumen es que
   sus datos están en la hoja, así que se pliega. `abrir` es el id del bloque
   que hay que dejar abierto aunque tenga resumen, porque el invitado está en
   ello (las canciones se guardan una a una y no hay que cerrarle la sección en
   mitad de la faena). */
function repasarBloques(abrir) {
  for (var i = 0; i < BLOQUES.length; i++) {
    var b = BLOQUES[i];
    var linea = document.getElementById('resumen-' + b.id);
    if (!linea) continue;

    var texto = b.resumen();
    linea.hidden = !texto;

    if (texto) {
      document.getElementById('resumen-texto-' + b.id).innerHTML =
        '<span class="solo-voz">Hecho: </span>' +
        '<span class="resumen-marca" aria-hidden="true">✓ </span>' + escapar(texto);
    }
    plegarBloque(b.id, !!texto && b.id !== abrir);
  }
}

/* Los botones de las líneas de resumen. Abren el bloque para reenviar, y lo
   vuelven a plegar sin tocar nada si se abrió por error. */
function cablearCambiar(id) {
  var boton = document.getElementById('cambiar-' + id);
  if (!boton) return;

  boton.onclick = function () {
    plegarBloque(id, boton.getAttribute('aria-expanded') === 'true');
    // El «Guardado» de antes no dice nada del formulario que se acaba de abrir.
    estadoBloque(id, '');
  };
}

/* --- resúmenes --- */

function resumenConfirmar() {
  if (!guardado.asiste) return '';
  var nota = document.getElementById('nota');
  return (elegido ? 'Sí, allí estarás' : 'No podrás venir') +
         (nota && nota.value.replace(/^\s+|\s+$/g, '') ? ' · con mensaje' : '');
}

function resumenAlergias() {
  return guardado.alergenos ? (alergenosTexto() || SIN_ALERGIAS) : '';
}

function resumenTransporte() {
  if (!guardado.vuelta) return '';
  return vuelta === SIN_VUELTA ? 'Sin autobús de vuelta' : 'Vuelta a las ' + vuelta;
}

/* Este no mira `guardado`: cada canción se guarda al añadirla, así que tenerlas
   ya es tenerlas mandadas. */
function resumenPlaylist() {
  if (!canciones.length) return '';
  return canciones.length === 1
    ? '1 canción propuesta'
    : canciones.length + ' canciones propuestas';
}

/* --- envíos --- */

function estadoBloque(id, texto, mal) {
  var e = document.getElementById('estado-' + id);
  if (!e) return;
  e.className = mal ? 'estado mal' : 'estado';
  e.textContent = texto;
}

/* Lo que es igual en los tres envíos: bloquear el botón, contar lo que pasa y,
   si sale bien, dar el campo por guardado, plegar el bloque y repasar el índice
   —que es donde se ve la lista de recados—. */
function enviarBloque(id, cuerpo, campo, bien) {
  var boton = document.getElementById('enviar-' + id);
  boton.disabled = true;
  estadoBloque(id, 'Guardando…');

  pedir('POST', API, JSON.stringify(cuerpo), function (d) {
    boton.disabled = false;
    if (!d || !d.ok) {
      estadoBloque(id, 'No se ha podido guardar. Inténtalo otra vez.', true);
      return;
    }
    guardado[campo] = true;
    estadoBloque(id, bien);
    repasarBloques();
    montarIndice();
  });
}

function enviarConfirmacion() {
  if (elegido === null) return;
  enviarBloque('confirmar', {
    token: token,
    asiste: elegido,
    nota: document.getElementById('nota').value
  }, 'asiste', elegido ? 'Guardado. Nos vemos allí.' : 'Guardado. Te echaremos de menos.');
}

function enviarAlergias() {
  var texto = alergenosTexto();
  if (!texto) return;
  enviarBloque('alergias', { token: token, alergenos: texto },
               'alergenos', 'Guardado. Se lo pasamos a la cocina.');
}

function enviarVuelta() {
  if (!vuelta) return;
  enviarBloque('transporte', { token: token, vuelta: vuelta },
               'vuelta', 'Guardado. Te guardamos sitio.');
}

/* El botón de alergias no se enciende hasta que haya algo que mandar: la celda
   vacía de la hoja significa «todavía no ha contestado», y mandarla vacía
   dejaría el formulario como sin hacer. */
function repasarEnvioAlergias() {
  var boton = document.getElementById('enviar-alergias');
  if (boton) { boton.disabled = !alergenosTexto(); }
}

function pintar(d) {

  pantalla(
    '<div id="contenido">' +

      '<section class="seccion" id="inicio">' +
        '<p class="emblema emblema-grande" id="emblema-inicio" aria-hidden="true">' +
          '<svg class="arco" viewBox="0 0 120 132">' +
            '<path d="M4 130 L4 64 A56 56 0 0 1 116 64 L116 130"/>' +
          '</svg>' +
        '</p>' +
        '<p class="novios">' + escapar(BODA.novios) + '</p>' +
        '<h1 class="nombre"> ¡Hola, ' + escapar(d.nombre) + '!</h1>' +
        '<p class="cita">Como ya sabes <strong> ¡Nos casamos! </strong> y nos encantaría que nos acompañases en este día tan especial. <br> Aquí te dejamos algunos detalles y toda la información que necesitas.</p>' +
      '</section>' +

      seccionFotos() +

      '<section class="seccion" id="el-dia">' +
        titulo('el-dia', 'El gran día') +
        '<dl class="datos">' +
          '<div><dt>Fecha</dt><dd>' + escapar(BODA.fecha) + '</dd></div>' +
          '<div><dt>Hora</dt><dd>' + escapar(BODA.hora) + '</dd></div>' +
          '<div><dt>Lugar</dt><dd>' + escapar(BODA.lugar) + '</dd></div>' +
        '</dl>' +
        (BODA.mapa
          ? '<p style="margin:0"><a class="mapa" href="' + escapar(BODA.mapa) + '" target="_blank" rel="noopener">Ver cómo llegar</a></p>'
          : '') +
      '</section>' +

      '<section class="seccion" id="confirmar">' +
        titulo('confirmar', '¿Nos acompañas?') +
        bloque('confirmar',
          '<div class="eleccion">' +
            '<button type="button" class="opcion" id="si" aria-pressed="false">Sí, allí estaré</button>' +
            '<button type="button" class="opcion" id="no" aria-pressed="false">No podré ir</button>' +
          '</div>' +

          '<p class="respuesta" id="respuesta" aria-live="polite"></p>' +

          /* El mensaje se queda aquí y no en una sección propia: a quien no
             puede venir se le esconde todo lo que va detrás de esta sección, y
             es justo lo que sí tiene sentido que nos deje escrito. */
          '<fieldset>' +
            '<label class="campo" for="nota">Un mensaje para nosotros</label>' +
            '<textarea id="nota" placeholder="Opcional"></textarea>' +
          '</fieldset>' +

          '<button type="button" class="enviar" id="enviar-confirmar" disabled>Enviar confirmación</button>'
        ) +
      '</section>' +

      seccionAlergias() +
      seccionCuenta() +
      seccionEnObras('dedicatoria') +
      seccionPlaylist() +
      seccionTransporte() +
      seccionEnObras('alojamiento') +
      seccionEnObras('sitio-web') +

    '</div>'
  );

  document.getElementById('si').onclick = function () { elegir(true); };
  document.getElementById('no').onclick = function () { elegir(false); };
  document.getElementById('enviar-confirmar').onclick = enviarConfirmacion;
  document.getElementById('enviar-alergias').onclick = enviarAlergias;

  /* Los botones de las líneas de resumen, uno por bloque. */
  for (var p = 0; p < BLOQUES.length; p++) { cablearCambiar(BLOQUES[p].id); }

  /* La cuenta atrás —y con ella el botón de guardar la fecha— no se pinta
     pasado el día de la boda. */
  var botonGuardar = document.getElementById('guardar');
  if (botonGuardar) { botonGuardar.onclick = guardarEnCalendario; }

  var botonesChip = document.getElementById('chips').getElementsByTagName('button');
  for (var j = 0; j < botonesChip.length; j++) {
    botonesChip[j].onclick = function () { alternarAlergeno(this); };
  }

  document.getElementById('otros').oninput = repasarEnvioAlergias;

  var buscar = document.getElementById('buscar');
  buscar.oninput = function () { programarBusqueda(this.value); };
  // Sin formulario que enviar, el Enter no hace nada por sí solo: que busque.
  buscar.onkeydown = function (e) {
    if (e.key === 'Enter' || e.keyCode === 13) { buscarYa(); }
  };

  /* Delegación en los dos contenedores: sus filas se repintan enteras cada vez
     y así no hay que volver a colgar un onclick por botón, como sí pasa con
     los chips, que se pintan una sola vez. */
  document.getElementById('resultados').onclick = function (e) {
    var b = botonDe(e.target, this);
    if (!b) return;

    if (b.getAttribute('data-manual')) {
      var texto = document.getElementById('buscar').value.replace(/^\s+|\s+$/g, '');
      if (texto) {
        anadirCancion({ cancion: texto, artista: '', album: '', itunes_id: '', enlace: '' });
      }
      return;
    }

    var r = hallazgos[Number(b.getAttribute('data-i'))];
    if (!r) return;
    anadirCancion({
      cancion:   r.trackName || '',
      artista:   r.artistName || '',
      album:     r.collectionName || '',
      itunes_id: r.trackId ? String(r.trackId) : '',
      enlace:    r.trackViewUrl || ''
    });
  };

  document.getElementById('mis-canciones').onclick = function (e) {
    var b = botonDe(e.target, this);
    var id = b && b.getAttribute('data-id');
    if (id) { quitarCancion(id); }
  };

  /* Sin trayecto elegible no hay botones que elegir ni nada que enviar desde
     *Transporte*: la sección se queda en los recorridos y ya está. */
  var cajaVuelta = document.getElementById('vuelta');
  if (cajaVuelta) {
    var botonesVuelta = cajaVuelta.getElementsByTagName('button');
    for (var v = 0; v < botonesVuelta.length; v++) {
      botonesVuelta[v].onclick = function () { elegirVuelta(this.getAttribute('data-v')); };
    }
    document.getElementById('enviar-transporte').onclick = enviarVuelta;
  }

  ponerIconos();
  arrancarCuenta();
  montarIndice();
  restaurar(d);
}

/* --- índice lateral --- */

/* Una sección está hecha cuando su formulario ya está guardado, o sea cuando
   tiene resumen. Las que no piden nada no cuentan. */
function seccionHecha(id) {
  for (var i = 0; i < BLOQUES.length; i++) {
    if (BLOQUES[i].id === id) return !!BLOQUES[i].resumen();
  }
  return false;
}

/* Se llama al pintar y cada vez que cambia el juego de secciones a la vista,
   así que empieza soltando lo que dejó la vez anterior. */
function montarIndice() {
  var presentes = [];
  var lista = '';

  document.body.style.overflow = '';
  window.onscroll = null;
  window.onresize = null;
  document.onkeydown = null;

  for (var i = 0; i < SECCIONES.length; i++) {
    var seccion = document.getElementById(SECCIONES[i].id);
    if (!seccion || seccion.hidden) continue;
    presentes.push(SECCIONES[i].id);

    var hecho = seccionHecha(SECCIONES[i].id);
    lista += '<li><a class="nav-enlace" href="#' + escapar(SECCIONES[i].id) + '"'
           + (hecho ? ' data-hecho="true"' : '') + '>'
           + '<span class="nav-punto" aria-hidden="true"></span>'
           + '<span>' + escapar(SECCIONES[i].titulo) + '</span>'
           + (hecho ? '<span class="solo-voz"> (hecho)</span>' : '')
           + '</a></li>';
  }

  /* Con una sola sección el índice sobra. Lo vaciamos en vez de dejarlo estar:
     esto también se llama al ocultar secciones, y el de antes se quedaría con
     enlaces a lo que ya no hay. */
  if (presentes.length < 2) {
    document.getElementById('navegacion').innerHTML = '';
    return;
  }

  document.getElementById('navegacion').innerHTML =
    '<button type="button" class="nav-boton" id="nav-boton" aria-expanded="false"' +
      ' aria-controls="nav-indice" aria-label="Índice de la invitación">' +
      '<span></span><span></span><span></span>' +
    '</button>' +
    '<div class="nav-velo" id="nav-velo"></div>' +
    '<nav class="nav" id="nav-indice" aria-label="Secciones de la invitación">' +
      '<ol>' + lista + '</ol>' +
    '</nav>';

  var boton = document.getElementById('nav-boton');
  var panel = document.getElementById('nav-indice');
  var velo  = document.getElementById('nav-velo');
  var enlaces = panel.getElementsByTagName('a');

  function abrir(si) {
    boton.setAttribute('aria-expanded', si ? 'true' : 'false');
    panel.className = si ? 'nav abierto' : 'nav';
    velo.className  = si ? 'nav-velo visible' : 'nav-velo';
    document.body.style.overflow = si ? 'hidden' : '';
  }

  boton.onclick = function () { abrir(boton.getAttribute('aria-expanded') !== 'true'); };
  velo.onclick  = function () { abrir(false); };
  for (var j = 0; j < enlaces.length; j++) {
    enlaces[j].onclick = function () { abrir(false); };
  }
  document.onkeydown = function (e) {
    var esc = e.key === 'Escape' || e.key === 'Esc' || e.keyCode === 27;
    if (esc && boton.getAttribute('aria-expanded') === 'true') { abrir(false); }
  };
  // Si el móvil abierto pasa a ancho de escritorio (giro de pantalla), el panel
  // se convierte en raíl y hay que soltar el bloqueo del scroll.
  window.onresize = function () {
    if (window.innerWidth >= 992) { abrir(false); }
    repasar();
  };

  function marcar(id) {
    for (var k = 0; k < enlaces.length; k++) {
      if (enlaces[k].getAttribute('href') === '#' + id) {
        enlaces[k].setAttribute('aria-current', 'true');
      } else {
        enlaces[k].removeAttribute('aria-current');
      }
    }
  }

  /* Manda la última sección cuyo borde superior haya pasado la franja de
     referencia. Con tres secciones sale más barato medirlas en cada scroll
     que sostener un IntersectionObserver y su estado. */
  function repasar() {
    // La portada es corta: arriba del todo la franja ya cae en la sección
    // siguiente, así que ahí mandamos la primera sin mirar nada más.
    if ((window.pageYOffset || document.documentElement.scrollTop) < 8) {
      marcar(presentes[0]);
      return;
    }
    var franja = window.innerHeight * 0.42;
    var mejor = presentes[0];
    for (var n = 0; n < presentes.length; n++) {
      if (document.getElementById(presentes[n]).getBoundingClientRect().top <= franja) {
        mejor = presentes[n];
      }
    }
    marcar(mejor);
  }

  /* Medir todas las secciones en cada evento de scroll sale caro: el navegador
     dispara muchos más scrolls que fotogramas pinta. Con el pestillo medimos
     una sola vez por fotograma. */
  var pendiente = false;
  var porFotograma = window.requestAnimationFrame
    ? function (f) { return window.requestAnimationFrame(f); }
    : function (f) { return setTimeout(f, 16); };

  window.onscroll = function () {
    if (pendiente) return;
    pendiente = true;
    porFotograma(function () { pendiente = false; repasar(); });
  };
  repasar();
}

/* Si ya había respondido antes, dejamos su respuesta puesta. Las canciones
   vienen en el mismo GET, así que se reponen aquí igual que los alérgenos. */
function restaurar(d) {
  canciones = d.canciones || [];
  pintarMisCanciones();

  /* Los alérgenos vuelven en una sola línea de texto: lo que coincide con un
     chip lo marca, y lo que no —lo que escribió en «otra cosa»— vuelve a su
     campo. Sin esa segunda mitad, abrir el bloque y reenviarlo lo borraría de
     la hoja, y el resumen diría menos de lo que hay guardado. */
  if (d.alergenos) {
    var previos = String(d.alergenos).split(',');
    var botones = document.getElementById('chips').getElementsByTagName('button');
    var sueltos = [];

    for (var i = 0; i < previos.length; i++) {
      var v = previos[i].replace(/^\s+|\s+$/g, '');
      if (!v) continue;

      var suyo = false;
      for (var j = 0; j < botones.length; j++) {
        if (botones[j].getAttribute('data-a') === v) {
          botones[j].setAttribute('aria-pressed', 'true');
          marcados[v] = true;
          suyo = true;
        }
      }
      if (!suyo) { sueltos.push(v); }
    }
    if (sueltos.length) { document.getElementById('otros').value = sueltos.join(', '); }
  }
  if (d.vuelta) { elegirVuelta(String(d.vuelta)); }
  if (d.nota) { document.getElementById('nota').value = d.nota; }
  if (d.asiste === 'SI') { elegir(true); }
  else if (d.asiste === 'NO') { elegir(false); }

  /* Lo que ya está en la hoja es lo que da cada formulario por hecho, y es lo
     que decide qué llega plegado y qué llega abierto. */
  guardado.asiste = !!d.asiste;
  guardado.alergenos = !!d.alergenos;
  guardado.vuelta = !!d.vuelta;

  repasarEnvioAlergias();
  repasarBloques();
  montarIndice();
}

function elegir(asiste) {
  elegido = asiste;
  document.getElementById('si').setAttribute('aria-pressed', asiste ? 'true' : 'false');
  document.getElementById('no').setAttribute('aria-pressed', asiste ? 'false' : 'true');

  var respuesta = document.getElementById('respuesta');
  respuesta.textContent = asiste ? RESPUESTAS.si : RESPUESTAS.no;
  respuesta.className = 'respuesta visible';

  ajustarAlcance(asiste);

  document.getElementById('enviar-confirmar').disabled = false;
}

cargar();
</script>
