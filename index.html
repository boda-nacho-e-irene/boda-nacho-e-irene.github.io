<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#E9E5D9">
<title>Invitación</title>

<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Karla:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Descomentar con la ruta de la primera foto de FOTOS: empieza a bajarla
     sin esperar al backend. Solo la primera; precargarlas todas le quita
     ancho de banda al resto de la página. -->
<!-- <link rel="preload" as="image" href="img/PRIMERA.webp"> -->

<!-- La hoja va partida por secciones, en el orden en que estaba escrita: el
     orden de estos enlaces es la cascada. Los tokens de color y de letra
     —lo único que se toca para cambiar cómo se ve— están en css/base.css. -->
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/portada.css">
<link rel="stylesheet" href="css/indice.css">
<link rel="stylesheet" href="css/transporte.css">
<link rel="stylesheet" href="css/formulario.css">
<link rel="stylesheet" href="css/bloques.css">
<link rel="stylesheet" href="css/playlist.css">
<link rel="stylesheet" href="css/cuenta.css">
<link rel="stylesheet" href="css/sobre.css">

<script>
/* Aquí dentro y en ES5 a propósito: se queda puesto antes de que corra ningún
   script de js/, así que si el navegador del invitado no entiende alguno, al
   menos vemos el error en pantalla en vez de quedarnos colgados. */
window.onerror = function (msg, src, linea) {
  var s = document.getElementById('sobre');
  if (s) { s.style.display = 'none'; }
  document.body.className = '';
  var a = document.getElementById('app');
  if (a) { a.innerHTML = '<p class="centrado">Error: ' + msg + ' (línea ' + linea + ')</p>'; }
  return true;
};
</script>

<!-- `defer` los baja mientras se lee la página y los ejecuta luego, en este
     orden y con el DOM ya montado. `datos.js` va primero porque los demás leen
     sus constantes, `calendario.js` después de `cuenta.js` porque le hereda
     `objetivoMs`, y `pintar.js` el último porque acaba llamando a cargar().
     Scripts normales, no módulos: comparten las variables de siempre sin
     imports, y así la página sigue abriéndose con doble clic desde el disco.
     Ojo al partir uno: lo que se ejecuta en cuanto baja el archivo (un `var`
     de arriba del todo) solo ve las funciones de su propio archivo, que son
     las únicas que suben. Por eso `BLOQUES` vive con sus `resumen*`.
     El laboratorio de ?lab no está aquí: lo baja cargar() y solo si hace falta. -->
<script defer src="js/datos.js"></script>
<script defer src="js/util.js"></script>
<script defer src="js/sobre.js"></script>
<script defer src="js/fotos.js"></script>
<script defer src="js/cuenta.js"></script>
<script defer src="js/calendario.js"></script>
<script defer src="js/transporte.js"></script>
<script defer src="js/playlist.js"></script>
<script defer src="js/formulario.js"></script>
<script defer src="js/bloques.js"></script>
<script defer src="js/indice.js"></script>
<script defer src="js/pintar.js"></script>

</head>
<body class="sobre-visible">

<div class="sobre-capa" id="sobre">
  <button type="button" class="sobre" id="sobre-btn" aria-label="Abrir la invitación">
    <span class="sobre-fondo"></span>
    <span class="sobre-carta"><svg class="carta-arco" viewBox="0 0 120 132" aria-hidden="true"><path d="M4 130 L4 64 A56 56 0 0 1 116 64 L116 130"/></svg></span>
    <span class="sobre-lado izq"></span>
    <span class="sobre-lado der"></span>
    <span class="sobre-frente"></span>
    <span class="sobre-nombre" id="sobre-nombre"></span>
    <span class="sobre-solapa"></span>
    <span class="sobre-lacre"><svg viewBox="0 0 120 132" aria-hidden="true"><path d="M4 130 L4 64 A56 56 0 0 1 116 64 L116 130"/></svg></span>
  </button>
  <p class="sobre-pista" id="sobre-pista"><span class="solo-tacto">Toca</span><span class="solo-raton">Haz clic</span> para abrir</p>
</div>

<div id="navegacion"></div>
<main id="app"><p class="centrado">Abriendo la invitación…</p></main>

</body>
</html>
