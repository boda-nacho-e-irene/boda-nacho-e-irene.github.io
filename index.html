<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#E9E5D9">
<title>Invitación</title>

<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Karla:wght@400;500;600&display=swap" rel="stylesheet">

<!-- La acuarela de la presentación es lo primero que se ve al apartarse el
     sobre, y como es un fondo de CSS el navegador no se entera de que existe
     hasta que baja y lee la hoja. Precargada empieza a bajar con la página y
     está puesta cuando el invitado abre el sobre. -->
<link rel="preload" as="image" href="img/presentacion.webp">

<!-- La hoja va partida por secciones, en el orden en que estaba escrita: el
     orden de estos enlaces es la cascada. Los tokens de color y de letra
     —lo único que se toca para cambiar cómo se ve— están en css/base.css. -->
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/presentacion.css">
<link rel="stylesheet" href="css/portada.css">
<link rel="stylesheet" href="css/indice.css">
<link rel="stylesheet" href="css/transporte.css">
<link rel="stylesheet" href="css/formulario.css">
<link rel="stylesheet" href="css/bloques.css">
<link rel="stylesheet" href="css/playlist.css">
<link rel="stylesheet" href="css/cuenta.css">
<link rel="stylesheet" href="css/sobre.css">

<script>
/* Aquí dentro y en ES5 a propósito: se queda puesto antes de que corra ningún
   script de js/, así que si el navegador del invitado no entiende alguno, al
   menos vemos el error en pantalla en vez de quedarnos colgados. */
window.onerror = function (msg, src, linea) {
  var s = document.getElementById('sobre');
  if (s) { s.style.display = 'none'; }
  document.body.className = '';
  var a = document.getElementById('app');
  if (a) { a.innerHTML = '<p class="centrado">Error: ' + msg + ' (línea ' + linea + ')</p>'; }
  return true;
};
</script>

<!-- `defer` los baja mientras se lee la página y los ejecuta luego, en este
     orden y con el DOM ya montado. `datos.js` va primero porque los demás leen
     sus constantes, `configuracion.js` antes de `pintar.js` porque es el que
     mezcla lo de la hoja, y `pintar.js` el último porque acaba llamando a cargar().
     Scripts normales, no módulos: comparten las variables de siempre sin
     imports, y así la página sigue abriéndose con doble clic desde el disco.
     Ojo al partir uno: lo que se ejecuta en cuanto baja el archivo (un `var`
     de arriba del todo) solo ve las funciones de su propio archivo, que son
     las únicas que suben. Por eso `BLOQUES` vive con sus `resumen*`.
     El laboratorio de ?lab no está aquí: lo baja cargar() y solo si hace falta. -->
<script defer src="js/datos.js"></script>
<script defer src="js/util.js"></script>
<script defer src="js/sobre.js"></script>
<!-- El sobre en 3D. Three.js no va aquí con un `defer`: haría esperar a
     pintar.js —y con él a la invitación entera— a que bajase del CDN. Lo pide
     js/sobre3d.js por su cuenta; el `preload` solo adelanta la descarga, sin
     hacer esperar a nadie. Si no baja, queda el sobre de CSS. -->
<link rel="preload" as="script" href="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js">
<script defer src="js/sobre3d.js"></script>
<script defer src="js/cuenta.js"></script>
<script defer src="js/calendario.js"></script>
<script defer src="js/transporte.js"></script>
<script defer src="js/playlist.js"></script>
<script defer src="js/formulario.js"></script>
<script defer src="js/bloques.js"></script>
<script defer src="js/indice.js"></script>
<script defer src="js/configuracion.js"></script>
<script defer src="js/pintar.js"></script>

</head>
<body class="sobre-visible">

<!-- `esperando`: no se ve ningún sobre hasta saber si va el de 3D o el de
     CSS. La quita js/sobre3d.js (como mucho a los 4 s). -->
<div class="sobre-capa esperando" id="sobre">
  <!-- Aquí pinta js/sobre3d.js el sobre de Three.js. Si no puede, se queda
       vacío y se ve el sobre de CSS de debajo. -->
  <canvas class="sobre-lienzo" id="sobre-lienzo" aria-hidden="true"></canvas>
  <!-- la sombra de la columna, para cuando la carta desplegada la ocupa -->
  <span class="sobre-columna" aria-hidden="true"></span>
  <button type="button" class="sobre" id="sobre-btn" aria-label="Abrir la invitación">
    <span class="sobre-fondo"></span>
    <!-- La carta: papel con un marco de acuarela y, en la ventana, la misma
         acuarela de la presentación. Al abrir sube, crece hasta llenar la
         pantalla y se funde con la presentación de verdad, que está detrás. -->
    <span class="sobre-carta">
      <span class="carta-manchas"></span>
      <span class="carta-ventana"></span>
    </span>
    <span class="sobre-lado izq"></span>
    <span class="sobre-lado der"></span>
    <span class="sobre-frente"></span>
    <span class="sobre-nombre" id="sobre-nombre"></span>
    <!-- El lacre va cosido a la solapa: al abrirse sube con ella. -->
    <span class="sobre-solapa">
      <span class="solapa-papel"></span>
      <span class="sobre-lacre"><img src="img/lacre.webp" alt=""></span>
    </span>
  </button>
  <!-- Dos pistas: la de tocar es la del sobre de CSS; la del sello, la del
       de 3D, que se abre arrastrando el lacre hacia arriba. -->
  <p class="sobre-pista" id="sobre-pista"><span class="pista-toque"><span class="solo-tacto">Toca</span><span class="solo-raton">Haz clic</span> para abrir</span><span class="pista-sello"><span class="solo-tacto">Desliza</span><span class="solo-raton">Arrastra</span> el sello hacia arriba</span></p>
</div>

<!-- El borde mojado de la acuarela: un ruido que desplaza los bordes de lo que
     lo lleva. Lo usan las manchas del fondo del sobre y el marco de la carta. -->
<svg class="filtros-ocultos" aria-hidden="true" focusable="false">
  <filter id="acuarela-borde" x="-15%" y="-15%" width="130%" height="130%">
    <feTurbulence type="fractalNoise" baseFrequency=".03" numOctaves="3" seed="7"/>
    <feDisplacementMap in="SourceGraphic" scale="16" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<div id="navegacion"></div>
<main id="app"><p class="centrado">Abriendo la invitación…</p></main>

</body>
</html>
